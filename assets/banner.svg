<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#140c24" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="pillGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 0.3px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }

    /* CSS Keyframe Animations for Dynamic Elements in Background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.25) translate(40px, -20px); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-40px) translateX(25px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes radarWave {
      0% { r: 10; opacity: 0.8; stroke-width: 2.5; }
      100% { r: 180; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes radarWave2 {
      0% { r: 10; opacity: 0.8; stroke-width: 2.5; }
      100% { r: 180; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes pulseSearchNode {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #38bdf8); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 15px #a855f7); }
    }

    .orb-anim-1 { animation: pulseOrb 12s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb-anim-2 { animation: pulseOrb2 14s ease-in-out infinite; transform-origin: 1000px 250px; }
    .radar-1 { animation: radarWave 5s linear infinite; }
    .radar-2 { animation: radarWave2 5s linear infinite 2.5s; }
    .p-anim-1 { animation: floatParticle 6s ease-in-out infinite; }
    .p-anim-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .p-anim-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .search-node { animation: pulseSearchNode 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LAYER: Glowing Orbs & Search Wave Simulation -->
  <g id="dynamic-background-elements">
    <!-- Ambient glowing nebulas (stay in deep background) -->
    <circle class="orb-anim-1" cx="220" cy="120" r="140" fill="#3b82f6" filter="url(#glow)" />
    <circle class="orb-anim-2" cx="1020" cy="280" r="160" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="600" cy="360" r="120" fill="#ec4899" opacity="0.18" filter="url(#glow)" />

    <!-- Animated AI Search Radar Waves on the Right Flank -->
    <g transform="translate(1040, 140)">
      <circle class="radar-1" cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" />
      <circle class="radar-2" cx="0" cy="0" r="10" fill="none" stroke="#a855f7" />
      <circle cx="0" cy="0" r="7" fill="#38bdf8" filter="url(#subtleGlow)" />
      
      <!-- Orbital Nodes representing Answer Engines -->
      <circle cx="65" cy="-45" r="4" fill="#a855f7" opacity="0.8" />
      <circle cx="-75" cy="50" r="5" fill="#38bdf8" opacity="0.8" />
      <circle cx="85" cy="40" r="3.5" fill="#ec4899" opacity="0.8" />
      <circle cx="-50" cy="-60" r="4.5" fill="#10b981" opacity="0.8" />
      <path d="M 0 0 L 65 -45 M 0 0 L -75 50 M 0 0 L 85 40 M 0 0 L -50 -60" stroke="#64748b" stroke-opacity="0.3" stroke-dasharray="3 3" />
    </g>

    <!-- Floating Data Citation Particles -->
    <circle class="p-anim-1" cx="120" cy="280" r="3" fill="#60a5fa" />
    <circle class="p-anim-2" cx="180" cy="340" r="2.5" fill="#c084fc" />
    <circle class="p-anim-3" cx="310" cy="310" r="3.5" fill="#38bdf8" />
    <circle class="p-anim-1" cx="890" cy="70" r="2.5" fill="#f472b6" />
    <circle class="p-anim-2" cx="950" cy="110" r="3" fill="#60a5fa" />
  </g>

  <!-- FOREGROUND LAYER: Content strictly placed to never be obscured -->
  <g id="foreground-content" transform="translate(60, 0)">
    <!-- Top Tagline & Category Header -->
    <g transform="translate(0, 75)">
      <rect x="0" y="-18" width="310" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="-4" r="5" fill="#10b981" filter="url(#subtleGlow)" />
      <text x="32" y="0" class="tagline">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome AI Search Optimization</text>

    <!-- Primary Subtitle -->
    <text x="0" y="190" class="subtitle">Generative Engine Optimization (GEO) • LLM Optimization (LLMO) • Answer Engines</text>

    <!-- Description Paragraph -->
    <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#94a3b8" letter-spacing="0.2">
      Tracking citation share, brand visibility, and agentic search across ChatGPT, Perplexity, Gemini, Claude &amp; Google AI Overviews.
    </text>

    <!-- Interactive / Highlighting Feature Pills in Lower Foreground -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: GEO & AEO -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-width="1.2" />
        <text x="90" y="26" text-anchor="middle" class="pill-text">🚀 GEO &amp; AEO Analytics</text>
      </g>

      <!-- Pill 2: llms.txt Standards -->
      <g transform="translate(196, 0)">
        <rect width="185" height="42" rx="21" fill="url(#pillGrad2)" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="92" y="26" text-anchor="middle" class="pill-text">📑 llms.txt Standard</text>
      </g>

      <!-- Pill 3: Citation Tracking -->
      <g transform="translate(397, 0)">
        <rect width="185" height="42" rx="21" fill="url(#pillGrad3)" stroke="#ec4899" stroke-width="1.2" />
        <text x="92" y="26" text-anchor="middle" class="pill-text">🎯 Citation Attribution</text>
      </g>

      <!-- Pill 4: Open-Source Crawlers -->
      <g transform="translate(598, 0)">
        <rect width="195" height="42" rx="21" fill="url(#pillGrad4)" stroke="#10b981" stroke-width="1.2" />
        <text x="97" y="26" text-anchor="middle" class="pill-text">🤖 Open-Source Crawlers</text>
      </g>

      <!-- Pill 5: Prompt Eval -->
      <g transform="translate(809, 0)">
        <rect width="195" height="42" rx="21" fill="url(#pillGrad5)" stroke="#f59e0b" stroke-width="1.2" />
        <text x="97" y="26" text-anchor="middle" class="pill-text">⚡ Prompt Evaluation</text>
      </g>
    </g>

    <!-- Bottom Footer Meta Information -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">
        Updated November 2026 • Curated for SEO Engineers, Founders &amp; AI Search Researchers
      </text>
    </g>
  </g>
</svg>
